# Plantilla para desplegar el worker de brokers por línea de comandos (opcional).

# 1) Cópiala a wrangler.toml y cambia el nombre por el de TU Worker.
# 2) En el panel de Cloudflare: Settings → Variables → pon ALLOWED_ORIGINS
#    con tus orígenes y crea los SECRETOS T212_KEY, T212_SECRET y ACCESS_KEY.
# 3) npx wrangler deploy (desde la raíz del repositorio).
# Si prefieres pegar el código en el panel (Quick Edit), este fichero no se usa.
name = "nido-brokers-TU-CUENTA"
main = "worker/precios.ts"
compatibility_date = "2025-01-01"