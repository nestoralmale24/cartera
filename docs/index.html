<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F7FD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#05070C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nido">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nido</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>
/* tema antes de pintar: preferencia guardada o del sistema */
(function(){try{var t=null;try{var s=JSON.parse(localStorage.getItem('cartera.theme.v1')||'null');if(s&&(s.t==='dark'||s.t==='light'))t=s.t}catch(e){}
if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})();
</script>
<style>
/* Sistema de diseño NA. (nestor-design). Cabecera de cristal fija, una columna (max 1180px),
   hero a dos columnas en escritorio que se apila bajo 760px; en móvil, barra inferior y hojas.
   Radios: tarjetas 16px, campos 10px, botones y chips pill. */
:root{
  --na-void:#05070C;--na-ink:#0D1B2A;--na-ink-2:#1A2636;--na-slate:#475260;--na-mist:#A3ADC1;
  --na-star:#F3F7FD;--na-silver:#D9E0ED;--na-blue:#2F6BDB;--na-blue-hi:#5B8CFF;
  --na-ember:#C8321F;--na-ember-hi:#E0503A;--na-dot:#C26A00;
  --na-ring:linear-gradient(100deg,#F3F7FD 0%,#5B8CFF 40%,#2F6BDB 62%,#C8321F 100%);
  --font:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --r-card:16px;--r-field:10px;--r-pill:999px;--r-lg:24px;
  --ease-out:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
  --c-page:var(--na-star);--c-surface:#fff;--c-sunken:#EAEFF7;--c-sunken-2:#DCE3EF;
  --c-text:var(--na-ink);--c-muted:var(--na-slate);--c-faint:#5F6B7C;
  --c-border:#C6CBD3;--c-divider:var(--na-silver);
  --c-accent:var(--na-blue);--c-accent-hover:#2559BD;--c-on-accent:#fff;
  --c-error:var(--na-ember);--c-warn:#B8651A;--c-brand:var(--na-dot);
  --c-shadow:0 1px 2px rgba(13,27,42,.06),0 8px 24px rgba(13,27,42,.08);
  --c-shadow-hi:0 2px 4px rgba(13,27,42,.08),0 16px 40px rgba(13,27,42,.14);
  --c-glass:rgba(243,247,253,.72);--c-scrim:rgba(5,7,12,.55);
  --c-focus:0 0 0 3px rgba(47,107,219,.40);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --c-page:var(--na-void);--c-surface:var(--na-ink);--c-sunken:var(--na-ink-2);--c-sunken-2:#243246;
  --c-text:var(--na-star);--c-muted:var(--na-mist);--c-faint:#8892A6;
  --c-border:#3A475F;--c-divider:rgba(217,224,237,.10);
  --c-accent:var(--na-blue-hi);--c-accent-hover:#7FA5FF;--c-on-accent:var(--na-void);
  --c-error:var(--na-ember-hi);--c-warn:var(--na-dot);--c-brand:var(--na-dot);
  --c-shadow:0 0 0 1px rgba(217,224,237,.08);
  --c-shadow-hi:0 0 0 1px rgba(91,140,255,.25),0 16px 40px rgba(0,0,0,.5);
  --c-glass:rgba(13,27,42,.62);
  --c-focus:0 0 0 3px rgba(91,140,255,.55);
}
/* alias de la app sobre los tokens --c-* */
:root{
  --bg:var(--c-page);--surface:var(--c-surface);--surface-2:var(--c-sunken);--surface-3:var(--c-sunken-2);
  --ink:var(--c-text);--ink-2:var(--c-muted);--ink-3:var(--c-faint);--line:var(--c-divider);--line-2:var(--c-border);
  --accent:var(--c-accent);--accent-soft:color-mix(in srgb,var(--c-accent) 12%,transparent);--on-accent:var(--c-on-accent);
  --gain:var(--c-accent);--gain-soft:var(--accent-soft);
  --loss:var(--c-error);--loss-soft:color-mix(in srgb,var(--c-error) 12%,transparent);
  --warn:var(--c-warn);--warn-soft:color-mix(in srgb,var(--c-warn) 14%,transparent);
  --k-stock:var(--c-accent);--k-etf:var(--c-text);--k-fund:var(--c-muted);--k-crypto:var(--na-dot);--k-cash:var(--c-border);--k-other:var(--c-sunken-2);
  --k-t212:var(--c-accent);--k-tr:var(--c-error);
  --glass:var(--c-glass);--sheet:var(--c-surface);--scrim:var(--c-scrim);
  --shadow:var(--c-shadow);--shadow-lg:var(--c-shadow-hi);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;transition:background-color .2s,color .2s}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.num,.big,.money{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.up{color:var(--gain)} .down{color:var(--loss)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:none;box-shadow:var(--c-focus);border-radius:var(--r-field)}

/* ---------- top bar */
/* modo privado (ojo de la cabecera): difumina todos los valores */
html.prv .money, html.prv .num, html.prv .r-num, html.prv .amt,
html.prv .delta, html.prv .big, html.prv .big2, html.prv .kv dd,
html.prv .kpis dd, html.prv .stats dd, html.prv .total-line b,
html.prv .meta b, html.prv .simple-list .r, html.prv .simple-list .l small,
html.prv .tx-list .r, html.prv .tx-list .l small, html.prv .spark,
html.prv .chart, html.prv .ylab, html.prv .alloc-bar, html.prv .alloc-list,
html.prv .pill, html.prv .preview, html.prv .subline, html.prv .faint,
html.prv .chosen small{
  filter:blur(.5em);
  -webkit-filter:blur(.5em);
  opacity:.7;
  user-select:none;-webkit-user-select:none;pointer-events:none;
}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;height:64px;display:flex;align-items:center;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;color:var(--c-text)}
.mark{width:28px;height:28px;border-radius:9px;background:var(--na-void);display:grid;place-items:center;color:var(--c-brand);box-shadow:0 0 0 1px var(--c-border)}
.mark svg{width:18px;height:18px;stroke-width:1.6}
.sync{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:2px}
.sync.err{color:var(--loss)}
.topbar .seg{margin:0 auto}
.actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.topbar .seg + .actions{margin-left:0}

/* ---------- segmented controls */
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-pill);padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:var(--r-pill);padding:9px 16px;min-height:40px;font-size:14px;font-weight:600;color:var(--ink-2);transition:color .2s var(--ease-out),background .2s var(--ease-out),box-shadow .2s var(--ease-out);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--c-shadow)}
.seg.small button{padding:7px 12px;min-height:36px;font-size:13px}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:12px 22px;border-radius:var(--r-pill);border:0;font-weight:600;font-size:14.5px;white-space:nowrap;transition:transform .1s ease-out,background-color .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.sm{min-height:40px;padding:8px 16px;font-size:13.5px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--c-accent-hover)}
.btn.secondary{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c-accent);color:var(--c-accent)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--c-border);color:var(--c-muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--c-text)}
.btn.danger{background:var(--c-error);color:#fff}
.btn.wide{width:100%;min-height:48px;font-size:15.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.iconbtn{width:40px;height:40px;border-radius:var(--r-pill);border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2);transition:background .15s,transform .1s}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn:active{transform:scale(.94)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:550;padding:6px 0;font-size:14.5px}
.linkbtn:active{opacity:.6}
a.linkbtn{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
a.linkbtn svg.i{width:16px;height:16px}

/* ---------- layout */
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.banner{max-width:1180px;margin:12px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:14px}
.banner-in.warn{background:var(--warn-soft)}
.banner-in.err{background:var(--loss-soft)}
.banner-in .btn{margin-left:auto}
.stack{display:grid;gap:20px}
.panel{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;min-width:0;transition:box-shadow .2s var(--ease-out)}
.panel:hover{box-shadow:var(--c-shadow-hi)}
.panel h3,.sec-title{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0 0 12px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.sec-head h3{margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}

/* ---------- hero */
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:stretch}
.hero-main{padding:22px 22px 14px}
.label{font-size:13px;color:var(--ink-2);margin:0 0 4px;font-weight:500}
.big{font-size:clamp(34px,5.2vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0}
.big2{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:0}
.subline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;font-size:14px;min-height:22px}
.delta{font-weight:550;font-variant-numeric:tabular-nums}
.chart-wrap{position:relative;margin-top:14px}
.chart{position:relative;height:230px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .ylab{position:absolute;right:0;font-size:11px;color:var(--ink-3);transform:translateY(-100%);padding-bottom:2px;font-variant-numeric:tabular-nums;pointer-events:none}
.chart .xlab{position:absolute;bottom:0;font-size:11.5px;color:var(--ink-3);pointer-events:none}
.chart-empty{display:grid;place-items:center;height:100%;color:var(--ink-3);font-size:14px;text-align:center;padding:0 24px;border:1px dashed var(--line-2);border-radius:14px}
.chart-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
.legend-inline{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2)}
.legend-inline span{display:inline-flex;align-items:center;gap:6px}
.legend-inline i{display:inline-block;width:14px;height:0;border-top:2px solid var(--accent)}
.legend-inline i.dash{border-top:2px dashed var(--ink-3)}

/* allocation */
.alloc-bar{display:flex;height:12px;border-radius:var(--r-pill);overflow:hidden;gap:2px;background:var(--surface-2);margin:4px 0 14px}
.alloc-bar span{display:block;height:100%;min-width:3px}
.alloc-list{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.alloc-list li{display:grid;grid-template-columns:12px 1fr auto auto;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.alloc-list .sw{width:10px;height:10px;border-radius:3px}
.alloc-list .pc{color:var(--ink-3);font-size:13px;min-width:52px;text-align:right}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.kpis dt{font-size:12.5px;color:var(--ink-2);margin:0 0 2px}
.kpis dd{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpis dd small{display:block;font-size:12.5px;font-weight:500;letter-spacing:0}

/* ---------- lists */
.list{display:grid}
.row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) 92px minmax(0,1.1fr) minmax(0,1fr);align-items:center;gap:14px;width:100%;text-align:left;border:0;background:transparent;padding:12px 10px;border-radius:12px;transition:background .12s}
.row:hover{background:var(--surface-2)}
.row:active{background:var(--surface-3)}
.row + .row{box-shadow:0 -1px 0 var(--line)}
.row:hover + .row,.row:hover{box-shadow:none}
.list-head{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) 92px minmax(0,1.1fr) minmax(0,1fr);gap:14px;padding:0 10px 8px;font-size:12px;color:var(--ink-3);font-weight:500}
.list-head span:not(:first-child),.row .r-num{text-align:right}
.r-name{display:flex;align-items:center;gap:12px;min-width:0}
.r-name .tx{min-width:0}
.r-name strong{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-name small{display:block;color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:11.5px;font-weight:650;letter-spacing:.01em;flex:none;color:var(--k);background:color-mix(in srgb,var(--k) 14%,transparent);position:relative;overflow:hidden}
.badge img.logo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:2px;box-sizing:border-box}
img.logo.sm{width:26px;height:26px;border-radius:7px;object-fit:contain;background:#fff;padding:1.5px;box-sizing:border-box;flex:none}
.simple-list .ll{display:flex;align-items:center;gap:10px;min-width:0}
.rate-wrap{position:relative}
.rate-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:160px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;z-index:70;text-align:left}
.rate-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:9px 12px;border:0;background:none;border-radius:9px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.rate-menu button:hover{background:var(--surface-2)}
.rate-menu button[aria-pressed="true"]{color:var(--accent);font-weight:600}
.rate-sep{margin:4px 8px;border-top:1px solid var(--line)}
.r-num{font-variant-numeric:tabular-nums;font-size:14.5px;min-width:0}
.r-num small{display:block;font-size:12.5px}
.spark{width:92px;height:30px}
.spark svg{width:100%;height:100%;display:block;overflow:visible}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;min-height:40px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink-2);font-size:13.5px;font-weight:500;transition:background .12s,transform .1s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--r-pill);font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.gain{background:var(--gain-soft);color:var(--gain)}
.pill.loss{background:var(--loss-soft);color:var(--loss)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.src{background:var(--surface-2);color:var(--ink-2);font-size:11px;margin-right:6px}
.simple-list{display:grid;margin:0;padding:0;list-style:none}
.simple-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;min-width:0}
.simple-list li + li{border-top:1px solid var(--line)}
.simple-list .l{min-width:0}
.simple-list .l strong{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.simple-list .l small{display:block;color:var(--ink-3);font-size:12.5px}
.simple-list .r{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.simple-list .r small{display:block;font-size:12.5px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head .big{font-size:clamp(30px,4.4vw,42px)}

/* cards for accounts and plans */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px;border:0;text-align:left;width:100%;display:grid;gap:12px;transition:transform .12s ease-out,box-shadow .2s;min-width:0}
.card.tappable{cursor:pointer}
.card.tappable:hover{box-shadow:var(--c-shadow-hi);transform:translateY(-2px)}
.card.tappable:active{transform:scale(.985)}
.simple-list .lb{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;background:none;padding:0;text-align:left;min-width:0;border-radius:10px}
.simple-list .lb:active{opacity:.6}
.enter{animation:enter .32s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card h4{margin:0;font-size:15.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .amt{font-size:26px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.card .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
.card .meta span{color:var(--ink-2)}
.card .meta b{font-weight:550;text-align:right;font-variant-numeric:tabular-nums}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}

/* switch */
.switch{position:relative;width:46px;height:28px;border-radius:var(--r-pill);background:var(--surface-3);border:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* empty + skeleton */
.empty{display:grid;justify-items:start;gap:14px;padding:36px 28px}
.empty h2{margin:0;font-size:clamp(24px,3.4vw,32px);letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.empty p{margin:0;color:var(--ink-2);max-width:58ch}
.empty .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.empty-small{color:var(--ink-3);font-size:14px;padding:14px 0}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:10px;width:100%}
.feat div{border-top:1px solid var(--line);padding-top:12px}
.feat b{display:block;font-weight:600;margin-bottom:2px}
.feat span{color:var(--ink-2);font-size:14px}
.sk{background:linear-gradient(90deg,var(--surface-2) 0%,var(--surface-3) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:sh 1.4s ease-in-out infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- sheet */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--scrim);z-index:40;opacity:0}
.sheet{position:fixed;z-index:50;background:var(--sheet);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;will-change:transform;outline:none}
@media (min-width:760px){
  .sheet{top:12px;right:12px;bottom:12px;width:min(540px,calc(100% - 24px));border-radius:22px;margin-top:env(safe-area-inset-top,0px);margin-bottom:env(safe-area-inset-bottom,0px)}
  .sheet-grip{display:none}
}
@media (max-width:759.98px){
  .sheet{left:0;right:0;bottom:0;max-height:calc(100% - env(safe-area-inset-top,0px) - 18px);border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}
.sheet-grip{height:22px;flex:none;display:grid;place-items:center;touch-action:none;cursor:grab}
.sheet-grip::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--line-2)}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1;padding:4px max(20px,env(safe-area-inset-right,0px)) 28px max(20px,env(safe-area-inset-left,0px))}
.sh-head{position:sticky;top:-4px;z-index:2;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:10px 0;margin:0 -4px 6px;background:var(--sheet);touch-action:none}
.sh-head h2{margin:0;text-align:center;font-size:16.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-sec{margin-top:24px}
.sh-sec > h3{font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 10px}
.asset-head{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.asset-head .badge{width:46px;height:46px;border-radius:14px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 12px;margin:18px 0 0;background:var(--surface-2);border-radius:16px;padding:14px}
.stats dt{font-size:12px;color:var(--ink-2)}
.stats dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px;overflow-wrap:anywhere}
.mini{height:150px;margin-top:14px;position:relative}
.mini svg{width:100%;height:100%;display:block;overflow:visible}
.tx-list{display:grid;margin:0;padding:0;list-style:none}
.tx-list li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:6px 10px;padding:11px 0}
.tx-list li + li{border-top:1px solid var(--line)}
.tx-list .l{min-width:0}
.tx-list .l strong{font-weight:550;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tx-list .l small{display:block;color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums}
.tx-list .r{text-align:right;font-variant-numeric:tabular-nums}
.tx-list .acts{display:flex;gap:2px}
.tx-list .acts .iconbtn{width:32px;height:32px}
.tx-list .acts svg.i{width:17px;height:17px}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px}

/* forms */
.form{display:grid;gap:16px}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:grid;gap:6px;min-width:0}
.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.field{width:100%;height:48px;border-radius:var(--r-field);border:1px solid var(--line-2);background:var(--surface);padding:12px 14px;font-size:16px;transition:border-color .15s,box-shadow .15s;font-variant-numeric:tabular-nums;min-width:0}
textarea.field{height:auto;min-height:110px;padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.5;resize:vertical}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 19px) 20px,calc(100% - 14px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.field:focus{outline:none;border-color:var(--accent);box-shadow:var(--c-focus)}
.field::placeholder{color:var(--ink-3)}
.help{font-size:12.5px;color:var(--ink-2);margin:0}
.help.err{color:var(--loss)}
.help.err::before{content:"✖ "}
.inline{display:flex;gap:8px}
.inline .field{flex:1}
.total-line{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface-2);border-radius:14px;padding:12px 14px}
.total-line b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days button{height:44px;border:0;border-radius:var(--r-pill);background:var(--surface-2);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;transition:background .12s,transform .1s}
.days button:active{transform:scale(.93)}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.check{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.plan-box{display:grid;gap:14px;background:var(--surface-2);border-radius:16px;padding:14px}
.plan-box .field{background:var(--surface)}
.preview{font-size:13.5px;color:var(--ink-2);background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.res-group{margin-top:18px}
.res-group h4{font-size:12.5px;color:var(--ink-3);font-weight:550;margin:0 0 6px}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 8px;border-radius:12px;transition:background .12s}
.res:hover{background:var(--surface-2)} .res:active{background:var(--surface-3)}
.res strong{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res small{display:block;color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chosen{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:16px;padding:12px}
.chosen .tx{min-width:0;flex:1}
.chosen strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chosen small{color:var(--ink-2);font-size:13px}
.loading-box{display:grid;place-items:center;gap:12px;padding:48px 0;color:var(--ink-2)}
.loading-box .spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--accent);border-right-color:transparent;animation:spin .7s linear infinite}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.qr-box{display:flex;justify-content:center;padding:16px 0}
.qr-box img{border-radius:12px;background:#fff;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.links{display:flex;gap:18px;flex-wrap:wrap}

/* ---------- toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--na-ink-2);color:var(--na-star);border-radius:var(--r-pill);padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px)}
.toast button{border:0;background:rgba(243,247,253,.16);color:var(--na-star);min-height:36px;border-radius:var(--r-pill);padding:0 14px;font-weight:600;font-size:13px}
.toast.solo{padding-right:18px}

/* ---------- bottom tab bar (phones) */
.tabbar{display:none}
@media (max-width:759.98px){
  .topbar .seg,.hide-m{display:none!important}
  .topbar-in{height:60px;gap:8px}
  .wrap{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{border:0;background:none;display:grid;justify-items:center;gap:3px;padding:6px 0;min-height:48px;font-size:11px;font-weight:600;color:var(--ink-3);transition:color .15s,transform .1s}
  .tabbar button:active{transform:scale(.94)}
  .tabbar button[aria-selected="true"]{color:var(--accent)}
  .tabbar svg.i{width:24px;height:24px}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .hero,.grid2{grid-template-columns:minmax(0,1fr)}
  .hero-main{padding:18px 16px 12px}
  .panel{padding:16px}
  .chart{height:200px}
  .row,.list-head{grid-template-columns:minmax(0,1fr) auto}
  .row .c-hide,.list-head .c-hide{display:none}
  .row{padding:12px 6px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .f-row{grid-template-columns:1fr}
  .f-row.keep{grid-template-columns:1fr 1fr}
  .empty{padding:28px 18px}
}
@media (min-width:760px) and (max-width:1020px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .row .c-md,.list-head .c-md{display:none}
  .row,.list-head{grid-template-columns:minmax(0,2fr) minmax(0,1fr) 92px minmax(0,1.1fr) minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .enter{animation:fade .15s linear}
  .card.tappable:hover{transform:none}
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-contrast:more){
  .panel,.card,.field,.sheet{box-shadow:none;border:1.5px solid var(--c-text)}
  .topbar,.tabbar,body::before{background:var(--c-page);backdrop-filter:none;-webkit-backdrop-filter:none}
}
/* Safari anterior a 16.2 (iPads antiguos): sin color-mix */
@supports not (background: color-mix(in srgb, red 50%, blue)){
  .badge{background:var(--surface-2)}
  .toast button{background:rgba(127,127,127,.28)}
  .res .pill{background:var(--surface-2)!important}
}
@media (prefers-reduced-transparency:reduce){
  .topbar,.tabbar,body::before{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
}
</style>

  </header>
  <div id="banner"></div>
  <main class="wrap" id="view"></main>

<script>window.NIDO_STANDALONE = true;</script>
<script>
(function () {
'use strict';

/* =========================================================
   Utilidades
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 86400000;
const pad = n => String(n).padStart(2, '0');
const newId = p => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function toEd(s) { const [y, m, d] = String(s).split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY); }
function fromEd(e) { const d = new Date(e * DAY); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
const todayEd = () => toEd(todayStr());
function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function validDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || '') && isFinite(toEd(s)); }

const G = { useGrouping: 'always' };
const NF = new Intl.NumberFormat('es-ES', Object.assign({ style: 'currency', currency: 'EUR' }, G));
const NF0 = new Intl.NumberFormat('es-ES', Object.assign({ style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }, G));
const NQ = new Intl.NumberFormat('es-ES', Object.assign({ maximumFractionDigits: 6 }, G));
const NP = new Intl.NumberFormat('es-ES', Object.assign({ minimumFractionDigits: 2, maximumFractionDigits: 2 }, G));
const NC = new Intl.NumberFormat('es-ES', { notation: 'compact', maximumFractionDigits: 1 });
const DF = new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const DFs = new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short', timeZone: 'UTC' });
const MINUS = '−';
const okNum = v => v != null && isFinite(v);
function eur(v) { return okNum(v) ? NF.format(v).replace('-', MINUS) : '-'; }
function eur0(v) { return okNum(v) ? NF0.format(v).replace('-', MINUS) : '-'; }
// valor tal cual o guion si está vacío (para campos externos, p.ej. Trading 212)
function f(v) { return (v == null || v === '') ? '—' : v; }
// importe en euros si es número, o tal cual si viene como texto
function money(v) { return okNum(v) ? eur(v) : f(v); }
function seur(v) { return okNum(v) ? (v >= 0 ? '+' : MINUS) + NF.format(Math.abs(v)) : '-'; }
function pct(v) { return okNum(v) ? (v >= 0 ? '+' : MINUS) + NP.format(Math.abs(v * 100)) + ' %' : '-'; }
function qtyf(q) { return okNum(q) ? NQ.format(q) : '-'; }
function pxf(v) {
  if (!okNum(v)) return '-';
  const d = Math.abs(v) < 1 ? 4 : 2;
  return new Intl.NumberFormat('es-ES', Object.assign({ style: 'currency', currency: 'EUR', minimumFractionDigits: d, maximumFractionDigits: d }, G)).format(v);
}
function compactEur(v) { return NC.format(v) + ' €'; }
function datef(s) { return validDate(s) ? DF.format(new Date(toEd(s) * DAY)) : '-'; }
function datefs(s) { return validDate(s) ? DFs.format(new Date(toEd(s) * DAY)) : '-'; }
function cls(v) { return v > 0.000001 ? 'up' : v < -0.000001 ? 'down' : 'muted'; }
function parseNum(s) {
  if (typeof s === 'number') return s;
  s = String(s == null ? '' : s).trim().replace(/\s|€|%/g, '');
  if (!s) return NaN;
  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (s.includes(',')) s = s.replace(',', '.');
  return Number(s);
}
function round(v, d) { const f = Math.pow(10, d); return Math.round(v * f) / f; }
function sig(v) { if (!okNum(v)) return v; const a = Math.abs(v); return round(v, a >= 1000 ? 2 : a >= 1 ? 4 : 8); }
function numIn(v, d = 2) { return okNum(v) ? String(round(v, d)).replace('.', ',') : ''; }
function ago(ts) {
  if (!ts) return '';
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'ahora mismo';
  if (m < 60) return 'hace ' + m + ' min';
  const h = Math.round(m / 60);
  if (h < 24) return 'hace ' + h + ' h';
  const d = Math.round(h / 24);
  return d === 1 ? 'hace 1 día' : 'hace ' + d + ' días';
}
function lastLE(arr, x) { let lo = 0, hi = arr.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (arr[m] <= x) { r = m; lo = m + 1; } else hi = m - 1; } return r; }
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* almacenamiento no disponible */ } }
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
const STANDALONE = !!window.NIDO_STANDALONE;
const isDesk = () => window.matchMedia ? window.matchMedia('(min-width:760px)').matches : true;

const svgI = d => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + d + '</svg>';
const IC = {
  close: svgI('<path d="M6 6l12 12M18 6L6 18"/>'),

  if (s == null || typeof s !== 'object') return null;

  let d = s;
  if (typeof s.data === 'function') d = s.data();
  else if (s.data && typeof s.data === 'object' && !Array.isArray(s.data)) d = s.data;

  if (!arr && typeof s.forEach === 'function') { arr = []; s.forEach(x => arr.push(x)); }

function subscribe() {
  const onData = snap => applyRemote(normList(snap));
  const onErr = e => {
    S.err = 'No pude leer tus datos guardados.';

function applyRemote(list) {
  const first = S.mode !== 'db';
  const busy = id => WQ.has(id) || S.pendingIds.has(id);
  const incoming = new Map(list.map(d => [d.id, d]));
  for (const [id, d] of incoming) if (!busy(id)) S.docs.set(id, d);
  for (const id of Array.from(S.docs.keys())) if (!incoming.has(id) && !busy(id)) S.docs.delete(id);
  S.mode = 'db'; S.err = null;
  if (first) {
    diag('primera lectura: ' + list.length + ' registros');
    for (const id of S.pendingIds) writeDoc(id);

function writeDoc(id) {

  (async () => {
    try {

/* =========================================================
   Cálculos
   ========================================================= */
function curOf(a) { return a.currency === 'GBp' ? 'GBP' : (a.currency || 'EUR'); }
function mulOf(a) { return a.currency === 'GBp' ? 0.01 : 1; }
function fxNow(cur) { if (cur === 'EUR') return 1; const f = (settings().fx || {})[cur]; return f > 0 ? f : null; }
function fxOn(cur, e) {
  if (cur === 'EUR') return 1;
  const h = (settings().fxHist || {})[cur];
  if (h && h.t && h.t.length) { const i = lastLE(h.t, e); if (i >= 0) return h.c[i]; }
  return fxNow(cur);
}
function unitFx(a, e) { const f = e == null ? fxNow(curOf(a)) : fxOn(curOf(a), e); return mulOf(a) * (f || 1); }
function priceEUR(a) { return a.price > 0 ? a.price * unitFx(a) : null; }
function prevEUR(a) { return a.prev > 0 ? a.prev * unitFx(a) : null; }

function txsOf(a) {
  const seen = new Set();
  return (a.txs || []).filter(t => t && validDate(t.date) && !seen.has(t.id) && seen.add(t.id))
    .sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : (x.side === 'buy' ? -1 : 1));
}
function applyTx(st, t) {
  const noPrice = t.pending || !(t.price > 0) || !(t.qty > 0);
  if (noPrice) { if (t.side !== 'sell') { st.pend += +t.amount || 0; st.pendN++; } return; }
  const fees = +t.fees || 0;
  if (t.side === 'sell') {
    const avg = st.qty > 0 ? st.cost / st.qty : 0;
    const q = Math.min(t.qty, st.qty);
    st.cost -= avg * q; st.realized += q * t.price - fees - avg * q; st.qty -= q;
    if (st.qty < 1e-10) { st.qty = 0; st.cost = 0; }
  } else { st.qty += t.qty; st.cost += t.qty * t.price + fees; }
  if (t.est) st.estN++;
}
function calcPos(a, skipTxId) {
  const st = { qty: 0, cost: 0, realized: 0, pend: 0, pendN: 0, estN: 0 };
  for (const t of txsOf(a)) if (t.id !== skipTxId) applyTx(st, t);
  const px = priceEUR(a), pv = prevEUR(a);
  const value = (px != null ? st.qty * px : st.cost) + st.pend;
  const cost = st.cost + st.pend;
  const pnl = value - cost;
  return {
    qty: st.qty, cost, avg: st.qty > 0 ? st.cost / st.qty : 0, price: px, value, pnl, pnlPct: cost > 0 ? pnl / cost : 0,
    realized: st.realized, day: (px != null && pv != null) ? st.qty * (px - pv) : 0, pendN: st.pendN, estN: st.estN
  };
}
function dedupeSort(arr) {
  const seen = new Set();
  return (arr || []).filter(m => m && validDate(m.date) && !seen.has(m.id) && seen.add(m.id)).sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
}
function cashCalc(c, endE) {
  if (endE == null) endE = todayEd();
  const moves = dedupeSort(c.moves);
  const rates = (c.rates || []).filter(r => validDate(r.from)).map(r => ({ e: toEd(r.from), apy: +r.apy || 0 })).sort((a, b) => a.e - b.e);
  let apyNow = rates.length ? rates[0].apy : 0;
  for (const r of rates) if (r.e <= endE) apyNow = r.apy;
  if (!moves.length) return { bal: 0, principal: 0, interest: 0, start: endE, ser: null, pser: null, apy: apyNow };
  const start = Math.min(toEd(moves[0].date), endE);
  const by = new Map();
  for (const m of moves) { const e = toEd(m.date); by.set(e, (by.get(e) || 0) + (+m.amount || 0)); }
  const n = endE - start + 1;
  const ser = new Float64Array(n), pser = new Float64Array(n);
  let b = 0, p = 0, ri = -1;
  for (let i = 0; i < n; i++) {
    const d = start + i;
    while (ri + 1 < rates.length && rates[ri + 1].e <= d) ri++;
    const apy = ri >= 0 ? rates[ri].apy : (rates.length ? rates[0].apy : 0);
    if (i > 0 && b > 0 && apy) b *= Math.pow(1 + apy / 100, 1 / 365);
    const mv = by.get(d) || 0;
    b += mv; p += mv;
    ser[i] = b; pser[i] = p;
  }
  return { bal: b, principal: p, interest: b - p, start, ser, pser, apy: apyNow };
}
let MEMO = null;
/* Convierte un activo virtual de broker en una entrada "pos" equivalente a las
   que produce calcPos(), para que el modelo y las vistas lo traten igual. */
function brokerPos(a) {
  const qty = a.vQty || 0;
  const value = a.vValue != null ? a.vValue : (okNum(a.price) ? qty * a.price : 0);
  const cost = a.vCost != null ? a.vCost : value;
  const pnl = a.vPpl != null ? a.vPpl : value - cost;
  return { a, qty, cost, avg: qty > 0 ? cost / qty : 0, price: a.price, value, pnl, pnlPct: cost > 0 ? pnl / cost : 0, realized: 0, day: 0, pendN: 0, estN: 0, broker: true, dayPct: null };
}
function model() {
  if (MEMO) return MEMO;
  const assets = all('asset'), accounts = all('cash'), plans = all('plan');
  const pos = assets.map(a => Object.assign({ a }, calcPos(a), { dayPct: (a.price > 0 && a.prev > 0) ? a.price / a.prev - 1 : null }));
  // Posiciones de brokers (solo lectura) mezcladas en el mismo listado.
  for (const a of t212Assets()) pos.push(brokerPos(a));
  for (const a of trAssets()) pos.push(brokerPos(a));
  let invValue = 0, invCost = 0, invDay = 0, realized = 0, pendN = 0, estN = 0;
  const missing = new Set();
  for (const p of pos) {
    invValue += p.value; invCost += p.cost; invDay += p.day; realized += p.realized; pendN += p.pendN; estN += p.estN;
    // Las posiciones de broker vienen valoradas en EUR por el propio broker:
    // no pedir conversión de divisa (eso causaba el aviso "Falta el tipo de cambio USD").
    if (!p.broker && p.qty > 0 && curOf(p.a) !== 'EUR' && !fxNow(curOf(p.a))) missing.add(curOf(p.a));
  }
  const cash = accounts.map(c => Object.assign({ c }, cashCalc(c)));
  let cashTotal = 0, interest = 0, monthInt = 0, yearInt = 0;
  for (const r of cash) {
    cashTotal += r.bal; interest += r.interest;
    if (r.bal > 0) { monthInt += r.bal * (Math.pow(1 + r.apy / 100, 30 / 365) - 1); yearInt += r.bal * r.apy / 100; }
  }
  // Liquidez de los brokers (efectivo de Trading 212 y Trade Republic).
  let t212Cash = 0, trCash = 0;
  if (!S.demo) {
    const tc = T.account && T.account.cash;
    if (tc) t212Cash = (+tc.availableToTrade || 0) + (+tc.inPies || 0) + (+tc.reservedForOrders || 0);
    trCash = (TR.cash || []).reduce((s, c) => s + (+c.amount || 0), 0);
  }
  cashTotal += t212Cash + trCash;
  const alloc = TYPE_ORDER.map(k => ({ k: TYPES[k].k, l: TYPES[k].p, v: pos.filter(p => typeOf(p.a) === k && !p.broker).reduce((s, p) => s + p.value, 0) }));
  alloc.push({ k: '--k-t212', l: 'Trading 212', v: pos.filter(p => p.broker && p.a.source === 't212').reduce((s, p) => s + p.value, 0) });
  alloc.push({ k: '--k-tr', l: 'Trade Republic', v: pos.filter(p => p.broker && p.a.source === 'tr').reduce((s, p) => s + p.value, 0) });
  alloc.push({ k: '--k-cash', l: 'Liquidez', v: cashTotal });
  const invPnl = invValue - invCost;
  const hasDay = pos.some(p => p.qty > 0 && p.a.prev > 0);
  MEMO = {
    assets, accounts, plans, pos, cash, invValue, invCost, invPnl, invPct: invCost > 0 ? invPnl / invCost : 0,
    invDay, invDayPct: (invValue - invDay) > 0 ? invDay / (invValue - invDay) : 0, hasDay, realized, pendN, estN,
    missingFx: Array.from(missing), cashTotal, interest, monthInt, yearInt, net: invValue + cashTotal,
    t212Cash, trCash, brokerCash: t212Cash + trCash,
    totalGain: invPnl + realized + interest, alloc, any: !!(assets.length || accounts.length || plans.length || pos.length)
  };
  return MEMO;
}
function history(R) {
  const end = todayEd();
  const assets = all('asset'), accounts = all('cash');
  let first = end;
  for (const a of assets) for (const t of a.txs || []) if (validDate(t.date)) first = Math.min(first, toEd(t.date));
  const cc = accounts.map(c => cashCalc(c));
  for (const r of cc) if (r.ser) first = Math.min(first, r.start);
  const brok = trAssets(), brok212 = t212Assets();
  for (const a of brok) if (a.hist && a.hist.t && a.hist.t.length) first = Math.min(first, a.hist.t[0]);
  const start = Math.max(end - R, first);
  const n = end - start + 1;
  if (n < 2) return null;
  const val = new Float64Array(n), con = new Float64Array(n);
  for (const a of assets) {
    const txs = txsOf(a); if (!txs.length) continue;
    const h = a.hist && a.hist.t && a.hist.t.length ? a.hist : null;
    const st = { qty: 0, cost: 0, realized: 0, pend: 0, pendN: 0, estN: 0 };
    const cur = curOf(a), mul = mulOf(a);
    let ti = 0, hi = -1;
    for (let i = 0; i < n; i++) {
      const d = start + i;
      while (ti < txs.length && toEd(txs[ti].date) <= d) { applyTx(st, txs[ti]); ti++; }
      let px = null;
      if (i === n - 1 && a.price > 0) px = priceEUR(a);
      else if (h) { while (hi + 1 < h.t.length && h.t[hi + 1] <= d) hi++; if (hi >= 0) px = h.c[hi] * mul * (fxOn(cur, d) || 1); }
      val[i] += (px != null ? st.qty * px : st.cost) + st.pend;
      con[i] += st.cost + st.pend;
    }
  }
  for (const r of cc) {
    if (!r.ser) continue;
    for (let i = 0; i < n; i++) { const k = start + i - r.start; if (k >= 0 && k < r.ser.length) { val[i] += r.ser[k]; con[i] += r.pser[k]; } }
  }
  // Posiciones de Trade Republic: la curva usa sus velas de precio
  // (el último día se valora al precio actual del broker).
  for (const a of brok) {
    const qty = a.vQty || 0, cost = a.vCost || 0;
    if (!(qty > 0)) continue;
    const h = a.hist && a.hist.t && a.hist.t.length ? a.hist : null;
    if (!h) { if (cost > 0) for (let i = 0; i < n; i++) { val[i] += cost; con[i] += cost; } continue; }
    for (let i = 0; i < n; i++) {
      const d = start + i;
      const j = lastLE(h.t, d);
      if (j < 0) continue; // antes de la primera vela no aporta
      val[i] += (i === n - 1 && a.price > 0) ? qty * a.price : qty * h.c[j];
      con[i] += cost;
    }
  }
  // Trading 212 no publica histórico de precios en su API: se valora a coste.
  for (const a of brok212) {
    const cost = a.vCost || 0;
    if (!(cost > 0)) continue;
    for (let i = 0; i < n; i++) { val[i] += cost; con[i] += cost; }
  }
  // Efectivo de los brokers: sin histórico, se suma plano a Patrimonio y Aportado.
  const tc = (T.account && T.account.cash) || {};
  const brokCash = (+tc.availableToTrade || 0) + (+tc.inPies || 0) + (+tc.reservedForOrders || 0) + (TR.cash || []).reduce((s, c) => s + (Number(c.amount) || 0), 0);
  if (brokCash > 0) for (let i = 0; i < n; i++) { val[i] += brokCash; con[i] += brokCash; }

/* =========================================================
   Planes mensuales
   ========================================================= */
function planDates(plan, fromE, toE) {
  const out = [];
  if (!(toE >= fromE)) return out;
  const days = (plan.days || []).map(Number).filter(d => d >= 1 && d <= 31);
  if (!days.length) return out;
  const a = new Date(fromE * DAY), b = new Date(toE * DAY);
  let y = a.getUTCFullYear(), m = a.getUTCMonth() + 1;
  const yb = b.getUTCFullYear(), mb = b.getUTCMonth() + 1;
  const seen = new Set();
  while (y < yb || (y === yb && m <= mb)) {
    const ml = daysInMonth(y, m);
    for (const d of days) {
      const e = toEd(y + '-' + pad(m) + '-' + pad(Math.min(d, ml)));
      if (e >= fromE && e <= toE && !seen.has(e)) { seen.add(e); out.push(e); }
    }
    m++; if (m > 12) { m = 1; y++; }
  }
  return out.sort((p, q) => p - q);
}
function planStartEd(p) { let s = toEd(p.start); if (p.activeFrom && validDate(p.activeFrom)) s = Math.max(s, toEd(p.activeFrom)); return s; }
function planEndEd(p) { return p.end && validDate(p.end) ? toEd(p.end) : Infinity; }
function planList(p) { const t = D().get(p.targetId); if (!t) return []; return (p.target === 'cash' ? t.moves : t.txs) || []; }
function executions(p) {
  let n = 0, sum = 0;
  for (const x of planList(p)) if (x.plan === p.id) { n++; sum += +x.amount || 0; }
  return { n, sum };
}
function doneDates(p) {
  const set = new Set(p.skip || []);
  for (const x of planList(p)) if (x.plan === p.id) set.add(x.date);
  return set;
}
function nextRunEd(p) {
  const t = todayEd();
  const s = Math.max(t, planStartEd(p));
  const e = Math.min(s + 400, planEndEd(p));
  const done = doneDates(p);
  const hit = planDates(p, s, e).find(x => !done.has(fromEd(x)));
  return hit == null ? null : hit;
}
function priceOn(asset, ds) {
  const e = toEd(ds); const h = asset.hist;
  if (h && h.t && h.t.length) {
    const first = h.t[0], last = h.t[h.t.length - 1];
    if (e >= first && e <= last) { const i = lastLE(h.t, e); return { price: h.c[i] * unitFx(asset, e), exact: true, from: fromEd(h.t[i]) }; }
    if (e > last && asset.price > 0) return { price: priceEUR(asset), exact: false };
    return null;
  }
  if (asset.price > 0 && (!asset.symbol || e >= todayEd() - 3)) return { price: priceEUR(asset), exact: false };
  return null;
}
function setTxPrice(t, px) {
  t.price = sig(px);
  t.qty = sig(((+t.amount || 0) - (+t.fees || 0)) / px);
  delete t.pending; delete t.est;
}
function planTx(asset, plan, ds, id) {
  const tx = { id, side: 'buy', date: ds, amount: round(+plan.amount, 2), fees: round(+plan.fees || 0, 2), plan: plan.id, auto: true, note: 'Plan mensual' };
  const p = priceOn(asset, ds);
  if (p && p.price > 0) { setTxPrice(tx, p.price); if (!p.exact) tx.est = true; }
  else { tx.pending = true; tx.price = null; tx.qty = null; }
  return tx;
}
function refineTxs(a) {
  let n = 0;
  for (const t of a.txs || []) {
    if (!t.auto || !(t.pending || t.est)) continue;
    const p = priceOn(a, t.date);
    if (!p || !(p.price > 0)) continue;
    if (p.exact) { setTxPrice(t, p.price); n++; }
    else if (t.pending) { setTxPrice(t, p.price); t.est = true; n++; }
  }
  return n;
}
function runPlans(silent) {
  if (!(S.demo || S.mode === 'db' || S.mode === 'local')) return 0;
  const t = todayEd();
  const changed = new Map();
  let count = 0;
  for (const plan of all('plan')) {
    if (!plan.active || !validDate(plan.start) || !(+plan.amount > 0)) continue;
    const base = changed.get(plan.targetId) || D().get(plan.targetId);
    if (!base) continue;
    const s = planStartEd(plan), e = Math.min(t, planEndEd(plan));
    const dates = planDates(plan, s, e);
    if (!dates.length) continue;
    const key = plan.target === 'cash' ? 'moves' : 'txs';
    const skip = new Set(plan.skip || []);
    const have = new Set((base[key] || []).map(x => x.id));
    let tgt = base;
    for (const ed of dates) {
      const ds = fromEd(ed), id = 'pl_' + plan.id + '_' + ds;
      if (have.has(id) || skip.has(ds)) continue;
      if (tgt === base) tgt = clone(base);
      tgt[key] = tgt[key] || [];
      if (plan.target === 'cash') tgt.moves.push({ id, date: ds, amount: round(+plan.amount, 2), note: 'Plan mensual', plan: plan.id });
      else tgt.txs.push(planTx(tgt, plan, ds, id));
      have.add(id); count++;
    }
    if (tgt !== base) changed.set(tgt.id, tgt);
  }
  for (const d of changed.values()) put(d, true);
  if (count) {
    scheduleRender();
    if (!silent && !S.demo) toast(count === 1 ? 'Plan mensual: 1 aportación apuntada' : 'Planes mensuales: ' + count + ' aportaciones apuntadas');
  }
  return count;
}
function daysText(days) {
  const d = (days || []).map(Number).sort((a, b) => a - b);
  if (!d.length) return '-';
  const s = d.map(x => x >= 29 ? x + ' (o último)' : String(x));
  const list = s.length > 1 ? s.slice(0, -1).join(', ') + ' y ' + s[s.length - 1] : s[0];
  return (d.length === 1 ? 'Día ' : 'Días ') + list + ' de cada mes';
}
function upcoming(days) {
  const t = todayEd(); const out = [];
  for (const p of all('plan')) {
    if (!p.active) continue;
    const tgt = D().get(p.targetId); if (!tgt) continue;
    const s = Math.max(t, planStartEd(p)); const e = Math.min(t + days, planEndEd(p));
    const done = doneDates(p);
    for (const ed of planDates(p, s, e)) if (!done.has(fromEd(ed))) out.push({ ed, p, tgt });
  }
  return out.sort((a, b) => a.ed - b.ed);
}

/* ---------- Conexión genérica al servidor de brokers ---------- */
async function brokerFetch(path, opts) {
  opts = opts || {};

  const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, 25000);
  let r, txt;
  try {
    const headers = (opts.init && opts.init.headers) ? Object.assign({}, opts.init.headers) : {};
    if (B.accessKey) headers['X-Access'] = B.accessKey;
    r = await fetch(B.proxy + path, Object.assign({ signal: ctrl ? ctrl.signal : undefined }, opts.init || {}, { headers }));
    txt = await r.text();
  } catch (e) {
    const er = new Error('sin respuesta'); er.code = 'broker_unreachable'; throw er;
  } finally { clearTimeout(timer); }
  let j = null;
  try { j = JSON.parse(txt); } catch (e) { /* no JSON */ }
  if (!r.ok) {
    const er = new Error((j && j.error) || 'error ' + r.status); er.code = (j && j.code) || 'broker_http'; er.status = r.status; throw er;
  }
  if (j && j.code) { const er = new Error(j.error); er.code = j.code; er.status = r.status; throw er; }
  return j;
}
function brokerErr(e) {
  const c = String(e && e.code || '');
  if (c === 'broker_unreachable') return 'El servidor de brokers no responde. Revisa la dirección en Ajustes o tu conexión.';
  if (c === 't212_unconfigured') return 'Trading 212 no está configurado. Revisa T212_KEY y T212_SECRET en Cloudflare.';
  if (c === 'access_denied') return 'Clave de acceso incorrecta. Revísala en Ajustes (Servidor de brokers).';
  if (e && e.status === 401) return 'Las credenciales no son válidas. Revisa la configuración en Cloudflare.';
  if (e && e.status === 429) return 'Demasiadas consultas. Prueba en un minuto.';
  return 'No pude leer el broker' + (e && e.message ? ': ' + e.message : '.');
}

/* Trade Republic no sirve precio de las criptos por WebSocket: se deriva el

const CG_MAP = { BTC: 'bitcoin', ETH: 'ethereum', SOL: 'solana', XRP: 'ripple', ADA: 'cardano', LTC: 'litecoin', DOT: 'polkadot', DOGE: 'dogecoin', LINK: 'chainlink', AVAX: 'avalanche-2', MATIC: 'matic-network', POL: 'polygon-ecosystem-token', ATOM: 'cosmos', BCH: 'bitcoin-cash', XLM: 'stellar', ALGO: 'algorand', NEAR: 'near', FTM: 'fantom', UNI: 'uniswap', AAVE: 'aave', TRX: 'tron', EOS: 'eos', FIL: 'filecoin' };

  return /^[A-Z]{3}$/.test(t) ? t : null;
}
function isCryptoLike(p) {
  return /crypto/i.test(String(p.instrumentType || '')) || /^XF/i.test(String(p.isin || ''));
}
async function trCryptoPrice(sym) {
  const id = CG_MAP[sym] || String(sym).toLowerCase();
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=' + encodeURIComponent(id) + '&vs_currencies=eur');
    if (!r.ok) return null;

  for (const p of positions || []) {
    if (!isCryptoLike(p) || okNum(p.currentPrice)) continue;
    const sym = trCryptoSymbol(p.isin);
    if (!sym) continue;
    const px = await trCryptoPrice(sym);
    if (px == null) continue;
    p.currentPrice = px;
  }
  for (const p of positions || []) {
    if (!isCryptoLike(p) || !okNum(p.currentPrice)) continue;
    const qty = Number(p.netSize || 0);

const LS_TRH = 'cartera.tr.hist.v1';

/* Histórico de criptos: Trade Republic no lo sirve por WebSocket; CoinGecko sí. */
async function trCryptoHist(sym) {
  const id = CG_MAP[sym] || String(sym).toLowerCase();

  const list = trAssets().filter(a => a.isin && a.vQty > 0);
  const stale = list.filter(a => !(TRH.by[a.isin] && TRH.by[a.isin].at && Date.now() - TRH.by[a.isin].at < (TRH.by[a.isin].miss ? TRH_MISS_TTL : TRH_TTL)));
  if (!stale.length) return;
  AR.trh = true;
  let changed = false;
  try {
    for (const a of stale) {
      const isin = a.isin;
      let h = null;
      if (a.type === 'crypto') { const sym = trCryptoSymbol(isin); if (sym) h = await trCryptoHist(sym); }
      else {
        try {
          const j = await trFetch('/history?isin=' + encodeURIComponent(isin) + '&range=1y&exchange=LSX');
          h = j && Array.isArray(j.candles) && j.candles.length >= 2 ? j.candles : null;
        } catch (e) { /* sin sesión o sin datos: se reintentará más tarde */ }
      }
      if (h) {
        if (Array.isArray(h)) h = { t: h.map(x => Math.floor(Number(x[0]) / DAY)), c: h.map(x => Number(x[1])) };
        if (!h.t || h.t.length < 2) h = null;

/* ---------- Logos por ISIN (Wikidata: P946 = ISIN, P154 = logo oficial) ---------- */
function logoCacheLoad() {
  const c = lsGet(LS_LOGOS);

async function logoLookup(isin) {
  const key = String(isin || '').trim().toUpperCase();
  if (!key) return;
  if (LOGOS.map[key] != null || LOGOS.pending.has(key)) return;
  LOGOS.pending.add(key);
  let url = '';
  try {
    const q = 'SELECT ?logo WHERE { ?item wdt:P946 "' + key + '" . ?item wdt:P154 ?logo . } LIMIT 6';
    const u = 'https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q);
    const r = await fetch(u, { headers: { 'User-Agent': 'nido/1.0 (local)' } });
    const j = await r.json();
    const logos = ((j && j.results && j.results.bindings) || []).map(b => b.logo && b.logo.value).filter(Boolean);
    const pick = logos.find(l => !/white/i.test(l)) || logos[0];
    if (pick) {
      const m = pick.split('Special:FilePath/')[1];
      const fname = m ? decodeURIComponent(m) : '';
      if (fname) url = 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(fname) + '?width=128';
    }
  } catch (e) { url = ''; }
  LOGOS.map[key] = url;
  lsSet(LS_LOGOS, { list: LOGOS.map });
  scheduleRender();
}
function applyLogos() {
  for (const img of $$('img.logo[data-isin]')) {
    const isin = String(img.dataset.isin || '').trim().toUpperCase();
    if (!isin) { img.remove(); continue; }
    if (LOGOS.map[isin] != null) { if (LOGOS.map[isin]) img.src = LOGOS.map[isin]; else img.remove(); }
    else logoLookup(isin);
  }
}

function planPreviewText(plan, targetId, days, start, end) {
  if (!days.length) return 'Marca al menos un día del mes.';
  if (!validDate(start)) return 'Elige la fecha de inicio.';
  const tmp = { id: plan ? plan.id : '__nuevo', days, start, end, activeFrom: plan && plan.activeFrom, skip: plan ? plan.skip : [], target: D().get(targetId) && D().get(targetId).kind === 'cash' ? 'cash' : 'asset', targetId };
  const t = todayEd();
  const s = planStartEd(tmp), e = Math.min(t, planEndEd(tmp));
  const done = plan ? doneDates(tmp) : new Set();
  const past = planDates(tmp, s, e).filter(x => !done.has(fromEd(x)));
  const nx = nextRunEd(tmp);
  let txt = nx != null ? 'Próxima aportación: ' + datef(fromEd(nx)) + '.' : 'No quedan fechas dentro del periodo.';
  if (past.length) txt += ' Se apuntarán ' + past.length + (past.length === 1 ? ' aportación ya pasada' : ' aportaciones ya pasadas') + ', desde el ' + datef(fromEd(past[0])) + ', con el precio de cada fecha.';
  return esc(txt);
}
function updatePlanPreview(f) {

  const plan = f.dataset.plan ? D().get(f.dataset.plan) : null;

}

/* Normaliza una posición de Trading 212 (campos reales de la API) a un activo
   virtual que el modelo puede sumar. Devuelve null si no hay datos aprovechables. */
function t212Assets() {
  const acc = T.account || {};
  const cur = acc.currency || 'EUR';
  return (T.positions || []).map(p => {
    const ins = p.instrument || {};
    const wi = p.walletImpact || {};
    const qty = p.quantity != null ? p.quantity : 0;
    const price = p.currentPrice != null ? p.currentPrice : null;
    const cost = wi.totalCost != null ? wi.totalCost : (p.averagePricePaid != null && qty ? p.averagePricePaid * qty : null);
    const value = wi.currentValue != null ? wi.currentValue : (price != null && qty != null ? price * qty : null);
    if (!ins.ticker && !ins.name) return null;
    return {
      id: 't212_' + (ins.ticker || ins.isin || Math.random().toString(36).slice(2, 8)),
      kind: 'asset', source: 't212', type: t212TypeOf(ins.name, ins.ticker), name: ins.name || ins.ticker,
      symbol: ins.ticker, isin: ins.isin || '', currency: ins.currency || cur,
      price: price, prev: price, txs: [], hist: null,
      vQty: qty, vCost: cost, vValue: value, vPpl: wi.unrealizedProfitLoss
    };
  }).filter(Boolean);
}
/* Clasifica un tipo de instrumento de Trade Republic a los tipos de la app. */
function trTypeOf(it) {
  const s = String(it || '').toLowerCase();
  if (/etf/.test(s)) return 'etf';
  if (/stock|share/.test(s)) return 'stock';
  if (/fund/.test(s)) return 'fund';
  if (/crypto/.test(s)) return 'crypto';
  return 'other'; // bonos, derivados, private markets...
}
/* Clasifica una posición de Trading 212 por su nombre/ticker (la API de
   posiciones no trae el tipo del instrumento). */
function t212TypeOf(name, ticker) {
  const s = String(name || '') + ' ' + String(ticker || '');
  if (/ETF|UCITS/i.test(s)) return 'etf';
  if (/\bfund\b|fondo|investment trust/i.test(s)) return 'fund';
  if (/bitcoin|ethereum|solana|xrp|cardano|dogecoin|polkadot|crypto|cripto/i.test(s)) return 'crypto';
  return 'stock';
}
function trAssets() {
  return (TR.positions || []).map(p => {
    const qty = p.netSize != null ? Number(p.netSize) : 0;
    const avg = p.averageBuyIn != null ? Number(p.averageBuyIn) : null;
    const cur = p.currency || 'EUR';
    const name = p.name || p.isin || 'Posición';
    const cost = (avg != null && qty) ? avg * qty : null;
    const price = okNum(p.currentPrice) ? Number(p.currentPrice) : avg;
    const value = okNum(p.value) ? Number(p.value) : cost;
    const ppl = okNum(p.ppl) ? Number(p.ppl) : null;
    const hh = p.isin ? TRH.by[p.isin] : null;
    const hist = hh && hh.t && hh.t.length ? { t: hh.t, c: hh.c } : null;
    return {
      id: 'tr_' + (p.isin || Math.random().toString(36).slice(2, 8)),
      kind: 'asset', source: 'tr', type: trTypeOf(p.instrumentType), name, symbol: p.isin || '', isin: p.isin || '',
      currency: cur, price: price, prev: price, txs: [], hist,
      vQty: qty, vCost: cost, vValue: value, vPpl: ppl
    };
  }).filter(Boolean);
}
function t212AccountHTML() {
  const a = T.account;
  if (!a) return '';
  const rows = [];
  const perc = (v) => (typeof v === 'number' && isFinite(v)) ? (v >= 0 ? '+' : MINUS) + NP.format(Math.abs(v * 100)) + ' %' : f(v);
  const cash = a.cash || {}, inv = a.investments || {};
  if (cash.availableToTrade != null) rows.push(['Disponible', money(cash.availableToTrade)]);
  if (cash.inPies != null) rows.push(['En pies', money(cash.inPies)]);
  if (cash.reservedForOrders != null) rows.push(['Reservado', money(cash.reservedForOrders)]);
  if (inv.totalCost != null) rows.push(['Invertido', money(inv.totalCost)]);
  if (inv.currentValue != null) rows.push(['Valor inversiones', money(inv.currentValue)]);
  if (inv.unrealizedProfitLoss != null) rows.push(['P&L latente', money(inv.unrealizedProfitLoss)]);
  if (inv.realizedProfitLoss != null) rows.push(['P&L realizado', money(inv.realizedProfitLoss)]);
  if (a.totalValue != null) rows.push(['Valor total', money(a.totalValue)]);
  if (inv.currentValue != null && inv.totalCost != null && inv.totalCost > 0) rows.push(['Rentabilidad', perc(inv.unrealizedProfitLoss / inv.totalCost)]);
  if (!rows.length) return '<p class="empty-small">Resumen de cuenta no disponible.</p>';
  return '<h3>Resumen de cuenta</h3><dl class="kv">' + rows.map(r => '<dt>' + esc(r[0]) + '</dt><dd>' + r[1] + '</dd>').join('') + '</dl>';
}

function trHTML() {

    h += '<h3 style="margin-top:16px">Posiciones</h3><ul class="simple-list">' + pos.map(p => {

      const ppl = okNum(p.ppl) ? Number(p.ppl) : null;
      return '<li><div class="l"><strong>' + esc(name) + '</strong><small>' + (p.isin ? esc(p.isin) + ' · ' : '') + 'Invertido ' + eur(invested) + '</small></div><div class="r num">' + qty + '<small class="' + cls(ppl || 0) + '">' + (ppl != null ? seur(ppl) : '—') + '</small></div></li>';

  if (toEd(date) > todayEd()) return ferr(f, 'txErr', 'La fecha no puede ser futura.');
  if (!(qty > 0)) return ferr(f, 'txErr', 'Indica cuántas participaciones.');
  if (!(price > 0)) return ferr(f, 'txErr', 'Indica el precio por participación.');
  if (fees < 0) return ferr(f, 'txErr', 'La comisión no puede ser negativa.');
  let a;
  if (ctx.assetId) { const cur = D().get(ctx.assetId); if (!cur) return ferr(f, 'txErr', 'Este activo ya no existe.'); a = clone(cur); }
  else {
    const ex = ctx.draft.symbol && all('asset').find(x => x.symbol === ctx.draft.symbol);
    a = ex ? clone(ex) : newAssetFrom(ctx.draft);
    if (!ex && !(a.price > 0)) { a.price = sig(price / (unitFx(a) || 1)); a.priceAt = Date.now(); a.manualAt = a.priceAt; }
  }
  if (side === 'sell') {
    const held = calcPos(a, ctx.txId).qty;
    if (qty > held + 1e-9) return ferr(f, 'txErr', 'Solo tienes ' + qtyf(held) + ' participaciones en esa fecha o antes.');
  }
  const before = [snap(a.id)];
  a.txs = a.txs || [];
  let t = ctx.txId ? a.txs.find(x => x.id === ctx.txId) : null;
  if (!t) { t = { id: newId('t') }; a.txs.push(t); }
  Object.assign(t, { side, date, qty: sig(qty), price: sig(price), fees: round(fees, 2), amount: round(side === 'sell' ? qty * price - fees : qty * price + fees, 2), note: el.note.value.trim() });
  delete t.est; delete t.pending; delete t.auto;
  put(a);
  let msg = ctx.txId ? 'Operación actualizada' : side === 'sell' ? 'Venta guardada' : 'Compra guardada';
  if (!ctx.txId && side === 'buy' && el.mkplan && el.mkplan.checked) {
    const amt = parseNum(el.pamount.value);
    const days = String(el.days.value || '').split(',').map(Number).filter(Boolean);
    if (amt > 0 && days.length) {
      const plan = { id: newId('p'), kind: 'plan', target: 'asset', targetId: a.id, amount: round(amt, 2), fees: 0, days, start: fromEd(todayEd() + 1), end: '', active: true, createdAt: Date.now() };
      before.push([plan.id, null]); put(plan);
      msg += ' y plan creado';
    }
  }
  if (ctx.back) sheetBack(); else { closeSheet(); }
  withUndo(msg, before);
};
FORM.assetEdit = f => {
  const id = f.dataset.id; const cur = D().get(id); if (!cur) return;
  const before = [snap(id)]; const a = clone(cur); const el = f.elements;
  a.name = el.name.value.trim() || a.name;
  a.type = el.type.value;
  const sym = el.symbol.value.trim().toUpperCase();
  if (sym !== (a.symbol || '')) { a.symbol = sym; a.hist = null; a.curCheck = !!sym || undefined; if (!sym) a.currency = 'EUR'; }
  a.isin = el.isin.value.trim().toUpperCase();
  const mp = parseNum(el.mprice.value);
  if (mp > 0) {
    if (curOf(a) !== 'EUR' && !fxNow(curOf(a))) { a.currency = 'EUR'; a.hist = null; }
    a.price = sig(mp / (unitFx(a) || 1)); a.priceAt = Date.now(); a.manualAt = a.priceAt;
  }
  put(a);
  withUndo('Datos del activo guardados', before);
};
FORM.cashNew = f => {
  const el = f.elements; const name = el.name.value.trim();
  const apy = parseNum(el.apy.value), bal = parseNum(el.bal.value), date = el.date.value;
  if (!name) return ferr(f, 'cashErr', 'Ponle un nombre a la cuenta.');
  if (!(apy >= 0) || apy > 50) return ferr(f, 'cashErr', 'Escribe la TAE en %, por ejemplo 2,25.');
  if (!validDate(date) || toEd(date) > todayEd()) return ferr(f, 'cashErr', 'Pon una fecha válida, hoy o anterior.');
  if (el.bal.value.trim() && !(bal >= 0)) return ferr(f, 'cashErr', 'El saldo debe ser un número positivo.');
  const c = { id: newId('c'), kind: 'cash', name, rates: [{ from: date, apy: round(apy, 3) }], moves: bal > 0 ? [{ id: newId('m'), date, amount: round(bal, 2), note: 'Saldo inicial' }] : [], createdAt: Date.now() };
  put(c); closeSheet();
  withUndo('Cuenta creada', [[c.id, null]]);
};
FORM.cashMove = f => {
  const el = f.elements; const id = f.dataset.cash || (el.acc && el.acc.value);
  const c0 = D().get(id); if (!c0) return ferr(f, 'moveErr', 'Elige una cuenta.');
  const amt = parseNum(el.amount.value), date = el.date.value;
  if (!(amt > 0)) return ferr(f, 'moveErr', 'Escribe un importe mayor que cero.');
  if (!validDate(date) || toEd(date) > todayEd()) return ferr(f, 'moveErr', 'Pon una fecha válida, hoy o anterior.');
  const before = [snap(id)];
  const c = clone(c0); c.moves = c.moves || [];
  c.moves.push({ id: newId('m'), date, amount: round(el.dir.value === 'out' ? -amt : amt, 2), note: el.note.value.trim() });
  put(c);
  if (!f.dataset.cash) closeSheet(); else { el.amount.value = ''; el.note.value = ''; }
  withUndo(el.dir.value === 'out' ? 'Retirada guardada' : 'Ingreso guardado', before);
};
FORM.rate = f => {
  const id = f.dataset.cash; const c0 = D().get(id); if (!c0) return;
  const apy = parseNum(f.elements.apy.value), from = f.elements.from.value;
  if (!(apy >= 0) || apy > 50) return ferr(f, 'rateErr', 'Escribe la TAE en %, por ejemplo 2,00.');
  if (!validDate(from)) return ferr(f, 'rateErr', 'Pon una fecha válida.');
  const before = [snap(id)];
  const c = clone(c0); c.rates = (c.rates || []).filter(r => r.from !== from); c.rates.push({ from, apy: round(apy, 3) });
  put(c);
  withUndo('TAE actualizada', before);
};
FORM.cashEdit = f => {
  const id = f.dataset.id; const c0 = D().get(id); if (!c0) return;
  const name = f.elements.name.value.trim(); if (!name) return;
  const before = [snap(id)]; const c = clone(c0); c.name = name; put(c);
  withUndo('Cuenta renombrada', before);
};
FORM.plan = f => {
  const el = f.elements;
  const targetId = el.target.value; const tgt = D().get(targetId);
  const amount = parseNum(el.amount.value), fees = parseNum(el.fees.value) || 0;
  const days = String(el.days.value || '').split(',').map(Number).filter(Boolean);
  const start = el.start.value, end = el.end.value;
  if (!tgt) return ferr(f, 'planErr', 'Elige el destino del plan.');
  if (!(amount > 0)) return ferr(f, 'planErr', 'Escribe el importe de cada aportación.');
  if (fees < 0 || fees >= amount) return ferr(f, 'planErr', 'La comisión debe ser menor que el importe.');
  if (!days.length) return ferr(f, 'planErr', 'Marca al menos un día del mes.');
  if (!validDate(start)) return ferr(f, 'planErr', 'Elige la fecha de inicio.');
  if (end && (!validDate(end) || end < start)) return ferr(f, 'planErr', 'La fecha final debe ser posterior al inicio.');
  const old = f.dataset.plan ? D().get(f.dataset.plan) : null;
  const before = [old ? snap(old.id) : null].filter(Boolean);
  const p = old ? clone(old) : { id: newId('p'), kind: 'plan', active: true, createdAt: Date.now(), skip: [] };
  Object.assign(p, { target: tgt.kind === 'cash' ? 'cash' : 'asset', targetId, amount: round(amount, 2), fees: tgt.kind === 'cash' ? 0 : round(fees, 2), days, start, end: end || '' });
  if (!old) before.push([p.id, null]);
  const tBefore = snap(targetId);
  put(p);
  const n = runPlans(true);
  if (n) before.push(tBefore);
  if (SH.stack.length > 1) sheetBack(); else closeSheet();
  withUndo((old ? 'Plan guardado' : 'Plan creado') + (n ? '. ' + n + (n === 1 ? ' aportación apuntada' : ' aportaciones apuntadas') : ''), before);
};
INPUT.plan = f => updatePlanPreview(f);
CHANGE.plan = f => updatePlanPreview(f);

/* =========================================================
   Arranque
   ========================================================= */
function bindGlobal() {
  document.addEventListener('click', e => {
    if (!e.target.closest('.rate-wrap')) {
      const rm = $('#rateMenu'); if (rm && !rm.hidden) rm.hidden = true;
    }
    const el = e.target.closest('[data-action]'); if (!el) return;
    const fn = ACT[el.dataset.action]; if (!fn) return;
    if (el.tagName === 'A') return;
    e.preventDefault(); fn(el, e);
  });
  // Si un logo no carga, se quita y quedan las letras de la insignia.
  document.addEventListener('error', e => {
    const t = e.target;
    if (t && t.tagName === 'IMG' && t.classList && t.classList.contains('logo')) t.remove();
  }, true);
  document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-form]'); if (!f) return;
    e.preventDefault();
    const fn = FORM[f.dataset.form]; if (fn) fn(f, e);
  });
  document.addEventListener('input', e => {
    const f = e.target.closest && e.target.closest('form[data-form]');
    if (f && INPUT[f.dataset.form]) INPUT[f.dataset.form](f, e.target);
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'sortSel') { UI.sort = e.target.value; saveUI(); render(); return; }
    const f = e.target.closest && e.target.closest('form[data-form]');
    if (f && CHANGE[f.dataset.form]) CHANGE[f.dataset.form](f, e.target);
  });
  $('#scrim').addEventListener('click', () => closeSheet());
  document.addEventListener('keydown', e => {
    const rm = $('#rateMenu');
    if (e.key === 'Escape') {
      if (rm && !rm.hidden) { rm.hidden = true; e.preventDefault(); return; }
      if (SH.open) { e.preventDefault(); sheetBack(); return; }
    }
    const t = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && t.dataset.action) { e.preventDefault(); t.click(); }
  });
  window.addEventListener('resize', () => { if (SH.open) { if (SH.anim) SH.anim.stop(); setSheetPos(0); } });
}
function boot() {
  const saved = lsGet(LS_UI);
  if (saved) {
    if (TABS.includes(saved.tab)) UI.tab = saved.tab;
    if ([30, 91, 182, 365].includes(saved.range)) UI.range = saved.range;
    if (saved.filter) UI.filter = saved.filter;
    if (saved.sort) UI.sort = saved.sort;
  }
  const ar = lsGet(LS_AUTOREFRESH);
  if (ar && AUTO_OPTS.includes(ar.s)) UI.refresh = ar.s;
  const th = lsGet(LS_THEME);
  if (th && ['auto', 'light', 'dark'].includes(th.t)) UI.theme = th.t;
  const pv = lsGet(LS_PRIVACY);
  if (pv) UI.privacy = !!pv.p;
  applyTheme(); applyPrivacy(); logoCacheLoad();
  const h = String(location.hash || '').slice(1);
  if (TABS.includes(h)) UI.tab = h;
  bindGlobal(); initDrag();
  if (STANDALONE) {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* sin persistencia */ }
  }
  t212CacheLoad(); trCacheLoad(); trHistCacheLoad();
  if (STANDALONE && !trLocal()) discardTR(); // sin URL local, los datos de Trade Republic se quedan fuera
  render();
  initStore(); initBrokers();
  setInterval(() => {
    if (S.retry.size && S.mode === 'db') { const ids = Array.from(S.retry); S.retry.clear(); for (const id of ids) writeDoc(id); }
  }, 10000);
  setInterval(() => { renderTop(); }, 60000);
  setInterval(() => { if (S.mode === 'db' || S.mode === 'local') runPlans(); }, 30 * 60000);
  // Actualización automática de brokers (frecuencia configurable arriba a la derecha).
  let lastAuto = Date.now();
  setInterval(() => {
    if (!STANDALONE || S.demo || UI.refresh <= 0) return;
    if (Date.now() - lastAuto < UI.refresh * 1000) return;
    if (AR.t212 || AR.tr) return;
    lastAuto = Date.now();
    autoRefreshNow();
  }, 1000);
  setTimeout(() => { if (STANDALONE && !S.demo) autoRefreshNow(); }, 1500);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && (S.mode === 'db' || S.mode === 'local')) { runPlans(); renderTop(); if (STANDALONE && !S.demo) autoRefreshNow(); } });
}
window.__nido = { calcPos, cashCalc, planDates, history, priceOn, runPlans, S, D, model };
boot();
})();
